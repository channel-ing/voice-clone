<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniMax 声音复刻</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#222;--sub:#777;--line:#e4e2dc;--accent:#3a6df0;--ok:#1f8a4c;--err:#c8342b}
@media (prefers-color-scheme:dark){:root{--bg:#17181b;--card:#212226;--text:#eee;--sub:#999;--line:#34353a;--accent:#6c93ff;--ok:#4cc17f;--err:#ff7a70}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font:inherit}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
button{margin-top:12px;padding:9px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
.msg{margin-top:10px;font-size:13px;white-space:pre-wrap;word-break:break-all}
.ok{color:var(--ok)}.err{color:var(--err)}
audio{width:100%;margin-top:12px}
.hint{font-size:12px;color:var(--sub);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip b{margin-left:6px;color:var(--sub);font-weight:400}
details summary{cursor:pointer;color:var(--sub);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>MiniMax 声音复刻</h1>
  <div class="sub">上传音频复刻音色，自定义 voice_id，输入文本生成并试听。API Key 只保存在你自己的浏览器里。</div>

  <div class="card">
    <h2>1. 设置</h2>
    <label>API Key（MiniMax 国内站）</label>
    <input id="key" type="password" placeholder="sk-api-...">
    <details>
      <summary>高级：接口地址 / 代理</summary>
      <label>接口 Base URL</label>
      <input id="base" value="https://api.minimaxi.com">
      <div class="hint">如果浏览器提示跨域（Failed to fetch），把这里改成你自己的代理地址。</div>
    </details>
    <button class="ghost" id="saveKey">保存到本地</button>
    <span class="msg" id="saveMsg"></span>
  </div>

  <div class="card">
    <h2>2. 上传音频复刻</h2>
    <label>音频文件（mp3 / m4a / wav，10秒–5分钟，≤20MB）</label>
    <input id="file" type="file" accept=".mp3,.m4a,.wav,audio/*">
    <label>自定义 voice_id（8–256 位，字母开头，可含数字、- 、_）</label>
    <input id="vid" placeholder="例如 mySweetVoice01">
    <div class="row">
      <div><label>试听文本（可选，复刻后返回示例音频）</label>
        <input id="demoText" value="你好，这是我复刻的声音。"></div>
      <div><label>模型（固定）</label><input value="speech-02-turbo" disabled></div>
    </div>
    <button id="cloneBtn">开始复刻</button>
    <div class="msg" id="cloneMsg"></div>
    <audio id="demoAudio" controls hidden></audio>
    <div class="hint">复刻出的音色若 7 天内未正式调用（用它合成语音），会被平台自动删除。复刻音色 9.90 元/个，首次用它合成时才计费；填写试听文本会按字数收取合成费用。以 MiniMax 平台最新规则为准。</div>
  </div>

  <div class="card">
    <h2>3. 生成音频</h2>
    <label>voice_id</label>
    <input id="useVid" placeholder="手输，或点下面已保存的">
    <div class="chips" id="chips"></div>
    <label>文本</label>
    <textarea id="text" placeholder="输入要合成的文字"></textarea>
    <label>模型（固定）</label><input value="speech-02-turbo" disabled>
    <button id="ttsBtn">生成音频</button>
    <div class="msg" id="ttsMsg"></div>

    <div id="player" hidden>
      <div class="hint" style="margin-top:14px">下面的语速、音调、音量都在本地实时调整，不会重新调用接口、不花钱。</div>
      <label>语速 <span id="spv">1.00x</span></label>
      <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1">
      <label>音调 <span id="piv">0 半音</span></label>
      <input id="pitch" type="range" min="-12" max="12" step="1" value="0">
      <label>音量 <span id="vov">100%</span></label>
      <input id="vol" type="range" min="0" max="2" step="0.05" value="1">
      <div class="row" style="gap:8px">
        <button id="playBtn" type="button">播放</button>
        <button id="stopBtn" type="button" class="ghost">停止</button>
        <button id="resetBtn" type="button" class="ghost">重置</button>
      </div>
      <div class="msg" id="playHint"></div>
      <div class="row" style="gap:8px">
        <button id="expBtn" type="button">下载调整后的音频（wav）</button>
        <a id="dl" hidden style="flex:1"><button class="ghost" type="button" style="width:100%">下载原始 mp3</button></a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
const $ = id => document.getElementById(id);
const MODEL = 'speech-02-turbo';
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null? d : v }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, v) }catch(e){} }
};
let voices = []; try{ voices = JSON.parse(store.get('mm_voices','[]')) }catch(e){}

$('key').value = store.get('mm_key','');
$('base').value = store.get('mm_base', $('base').value);
$('saveKey').onclick = () => {
  store.set('mm_key', $('key').value.trim());
  store.set('mm_base', $('base').value.trim());
  $('saveMsg').textContent = '已保存'; $('saveMsg').className = 'msg ok';
};
// ===== 本地播放器：语速/音调/音量在浏览器里实时调整，不重新请求接口 =====
let grain = null, gainNode = null, fallbackAudio = null, srcDecoded = null;
const hasTone = () => typeof Tone !== 'undefined';

function applyParams(){
  const sp = +$('speed').value, pi = +$('pitch').value, vo = +$('vol').value;
  $('spv').textContent = sp.toFixed(2) + 'x';
  $('piv').textContent = (pi > 0 ? '+' : '') + pi + ' 半音';
  $('vov').textContent = Math.round(vo * 100) + '%';
  if(grain){ grain.playbackRate = sp; grain.detune = pi * 100; gainNode.gain.value = vo; }
  if(fallbackAudio){ fallbackAudio.playbackRate = sp; fallbackAudio.volume = Math.min(vo, 1); }
}
['speed','pitch','vol'].forEach(id => $(id).oninput = applyParams);

function stopPlay(){
  if(grain){ try{ grain.stop() }catch(e){} }
  if(fallbackAudio){ fallbackAudio.pause(); fallbackAudio.currentTime = 0; }
}
async function startPlay(){
  stopPlay();
  if(grain){ await Tone.start(); applyParams(); grain.start(); }
  else if(fallbackAudio){ applyParams(); fallbackAudio.play().catch(()=>{}); }
}
async function loadPlayer(blob){
  stopPlay();
  if(grain){ grain.dispose(); grain = null; }
  if(gainNode){ gainNode.dispose(); gainNode = null; }
  fallbackAudio = null; $('playHint').textContent = '';
  if(hasTone()){
    try{
      const decoded = await Tone.getContext().rawContext.decodeAudioData(await blob.arrayBuffer());
      srcDecoded = decoded;
      gainNode = new Tone.Gain(1).toDestination();
      grain = new Tone.GrainPlayer({url: new Tone.ToneAudioBuffer(decoded), grainSize: 0.1, overlap: 0.05, loop: false}).connect(gainNode);
    }catch(e){ grain = null; }
  }
  if(!grain){
    fallbackAudio = new Audio(URL.createObjectURL(blob));
    $('playHint').textContent = '变调组件未能加载（需要联网），目前只支持语速和音量（音量最大 100%），音调调节不可用。';
  }
  applyParams();
  $('player').hidden = false;
}
// 导出：把当前语速/音调/音量离线渲染成 wav 再下载（全程本地，不调用接口）
function audioBufferToWav(ab){
  const ch = ab.numberOfChannels, len = ab.length, sr = ab.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0,'RIFF'); out.setUint32(4, 36 + len*ch*2, true); w(8,'WAVEfmt ');
  out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,ch,true);
  out.setUint32(24,sr,true); out.setUint32(28,sr*ch*2,true); out.setUint16(32,ch*2,true); out.setUint16(34,16,true);
  w(36,'data'); out.setUint32(40, len*ch*2, true);
  const data = []; for(let c=0;c<ch;c++) data.push(ab.getChannelData(c));
  let o = 44;
  for(let i=0;i<len;i++) for(let c=0;c<ch;c++){
    const s = Math.max(-1, Math.min(1, data[c][i]));
    out.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2;
  }
  return new Blob([out], {type:'audio/wav'});
}
async function exportAdjusted(){
  if(!srcDecoded || !hasTone()) throw new Error('导出需要联网加载的变调组件，当前不可用，请下载原始 mp3');
  const sp = +$('speed').value, pi = +$('pitch').value, vo = +$('vol').value;
  const dur = srcDecoded.duration / sp + 0.6;
  const rendered = await Tone.Offline(() => {
    const g = new Tone.Gain(vo).toDestination();
    const gp = new Tone.GrainPlayer({url: new Tone.ToneAudioBuffer(srcDecoded), grainSize: 0.1, overlap: 0.05, playbackRate: sp, detune: pi * 100}).connect(g);
    gp.start(0);
  }, dur, 1, srcDecoded.sampleRate);
  return audioBufferToWav(rendered.get());
}
$('expBtn').onclick = async () => {
  const btn = $('expBtn'), old = btn.textContent;
  try{
    btn.disabled = true; btn.textContent = '导出中…';
    const blob = await exportAdjusted(), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = ($('useVid').value.trim() || 'voice') + '-adjusted.wav';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ $('playHint').textContent = e.message; $('playHint').className = 'msg err'; }
  finally{ btn.disabled = false; btn.textContent = old; }
};
$('playBtn').onclick = startPlay;
$('stopBtn').onclick = stopPlay;
$('resetBtn').onclick = () => { $('speed').value = 1; $('pitch').value = 0; $('vol').value = 1; applyParams(); };
applyParams();

function renderChips(){
  $('chips').innerHTML = '';
  voices.forEach(v=>{
    const c = document.createElement('span'); c.className='chip'; c.textContent = v;
    const x = document.createElement('b'); x.textContent='×';
    x.onclick = e => { e.stopPropagation(); voices = voices.filter(i=>i!==v); store.set('mm_voices', JSON.stringify(voices)); renderChips(); };
    c.appendChild(x); c.onclick = ()=> $('useVid').value = v;
    $('chips').appendChild(c);
  });
}
renderChips();

const cfg = () => {
  const key = $('key').value.trim(), base = $('base').value.trim().replace(/\/$/,'');
  if(!key) throw new Error('请先填写 API Key');
  return {key, base};
};
const setMsg = (el, t, cls) => { el.textContent = t; el.className = 'msg ' + (cls||''); };

// 复刻
$('cloneBtn').onclick = async () => {
  const msg = $('cloneMsg'), btn = $('cloneBtn');
  try{
    const {key, base} = cfg();
    const f = $('file').files[0], vid = $('vid').value.trim();
    if(!f) throw new Error('请选择音频文件');
    if(f.size > 20*1024*1024) throw new Error('文件超过 20MB');
    if(!/^[A-Za-z][A-Za-z0-9_-]{7,255}$/.test(vid)) throw new Error('voice_id 需 8–256 位，字母开头，仅含字母数字 - _');
    btn.disabled = true; $('demoAudio').hidden = true;

    setMsg(msg, '上传音频中…');
    const fd = new FormData(); fd.append('purpose','voice_clone'); fd.append('file', f);
    const up = await fetch(base + '/v1/files/upload', {method:'POST', headers:{Authorization:'Bearer '+key}, body: fd});
    const upj = await up.json();
    if(upj.base_resp && upj.base_resp.status_code !== 0) throw new Error('上传失败：' + upj.base_resp.status_msg);
    const fileId = upj.file.file_id;

    setMsg(msg, '复刻中…（文件已上传 file_id=' + fileId + '）');
    const body = {file_id: fileId, voice_id: vid};
    const demo = $('demoText').value.trim();
    if(demo){ body.text = demo; body.model = MODEL; }
    const cl = await fetch(base + '/v1/voice_clone', {method:'POST', headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const clj = await cl.json();
    if(clj.base_resp && clj.base_resp.status_code !== 0) throw new Error('复刻失败：' + clj.base_resp.status_msg + '（' + clj.base_resp.status_code + '）');

    if(!voices.includes(vid)){ voices.unshift(vid); store.set('mm_voices', JSON.stringify(voices)); renderChips(); }
    $('useVid').value = vid;
    setMsg(msg, '复刻成功！voice_id：' + vid, 'ok');
    if(clj.demo_audio){ $('demoAudio').src = clj.demo_audio; $('demoAudio').hidden = false; }
  }catch(e){
    setMsg(msg, e.message + (e instanceof TypeError ? '\n（可能是跨域被拦截，请在“高级”里设置代理地址）' : ''), 'err');
  }finally{ btn.disabled = false; }
};

// 合成
const hexToBlob = hex => {
  const arr = new Uint8Array(hex.length/2);
  for(let i=0;i<arr.length;i++) arr[i] = parseInt(hex.substr(i*2,2),16);
  return new Blob([arr], {type:'audio/mpeg'});
};
$('ttsBtn').onclick = async () => {
  const msg = $('ttsMsg'), btn = $('ttsBtn');
  try{
    const {key, base} = cfg();
    const vid = $('useVid').value.trim(), text = $('text').value.trim();
    if(!vid) throw new Error('请填写 voice_id');
    if(!text) throw new Error('请输入文本');
    btn.disabled = true; setMsg(msg, '生成中…');
    const res = await fetch(base + '/v1/t2a_v2', {method:'POST', headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},
      body: JSON.stringify({
        model: MODEL, text, stream:false, output_format:'hex',
        voice_setting:{voice_id: vid, speed:1, vol:1, pitch:0},
        audio_setting:{sample_rate:32000, bitrate:128000, format:'mp3', channel:1}
      })});
    const j = await res.json();
    if(j.base_resp && j.base_resp.status_code !== 0) throw new Error('生成失败：' + j.base_resp.status_msg + '（' + j.base_resp.status_code + '）');
    const blob = hexToBlob(j.data.audio), url = URL.createObjectURL(blob);
    $('dl').href = url; $('dl').download = vid + '.mp3'; $('dl').hidden = false;
    await loadPlayer(blob);
    setMsg(msg, '生成成功，点下方“播放”试听，可随时调整语速/音调/音量', 'ok');
  }catch(e){
    setMsg(msg, e.message + (e instanceof TypeError ? '\n（可能是跨域被拦截，请在“高级”里设置代理地址）' : ''), 'err');
  }finally{ btn.disabled = false; }
};
</script>
</body>
</html>
